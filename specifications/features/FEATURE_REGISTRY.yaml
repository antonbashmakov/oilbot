# Task registry — the only place for statuses and progress.
# Rules: agent-rules/rules/003-workflow.md, 016-specifications-upkeep.md. Validated by agent-rules/scripts/check_specs.py.

project:
  name: "oilbot"
  client: "Anton Bashmakov"
  tracker:
    name: "GitHub"
    label: "GH"
    url: "https://github.com/antonbashmakov/oilbot/issues/"
  extra_labels: []                   # extra criterion labels, for example ["PARTNER"] for a partner contract
  review_translation: "optional"     # "required": every data text needs a Russian translation (i18n/)
  status_model:
    - { code: "planned", label: "Not started", set_by: "-" }
    - { code: "in_progress", label: "In progress", set_by: "agent or developer" }
    - { code: "blocked", label: "Blocked", set_by: "agent or developer" }
    - { code: "code_review", label: "Code review", set_by: "agent or developer" }
    - { code: "review_fixes", label: "Review fixes", set_by: "agent or developer" }
    - { code: "ready_for_review", label: "Ready for review", set_by: "agent or developer" }
    - { code: "ready_for_test", label: "Ready for test (RFT)", set_by: "developer only" }
    - { code: "done", label: "Done", set_by: "developer only" }

epics:
  - { id: "SETUP-01", title: "Agent workflow adoption", spec: "features/SETUP-01-agent-workflow.md" }
  - { id: "TWA-01", title: "Mini App launch in Telegram", spec: "features/TWA-01-mini-app-launch.md" }
  - { id: "CAR-01", title: "Saved car in the AI chat", spec: "features/CAR-01-saved-car.md" }
  - { id: "CAR-02", title: "Car model suggestions", spec: "features/CAR-02-car-suggestions.md" }

features:
  - id: "SETUP-01-DOC"
    epic: "SETUP-01"
    title: "Adapt the agent workflow to this project"
    surface: "docs"
    tracker_ids: []
    status: "in_progress"
    progress_percent: 80
    depends_on: []
    acceptance_criteria:
      - "[Team] The stack is installed: agent-rules/boilerplate.lock names it and the gate step agent / stack passes"
      - "[Team] AGENTS.md project sections and rules 001, 104 and 115 describe this project; no <placeholder> is left"
      - "[Team] agent-rules/project.sh names the code paths, contracts and build steps of this project"
      - "[Team] The project section of the registry names the project, the client and the task tracker"
      - "[Team] PRD, system overview and personal data inventory describe the current state"
      - "[Team] agent-rules/scripts/gate.sh passes with no skipped step"

  - id: "TWA-01-BE"
    epic: "TWA-01"
    title: "Customer token, protected chat API, latest chat history, Firestore index"
    surface: "backend"
    tracker_ids: []
    status: "code_review"
    progress_percent: 90
    depends_on: []
    acceptance_criteria:
      - "[Team] POST /public/auth returns a customer token in the body and in the __session cookie; the token names the customer id"
      - "[Team] The private chat endpoints answer 401 without a valid customer token and 403 when the token belongs to another customer (BUG-001)"
      - "[Team] The chat history sent to the UI and to the AI is the latest 10 messages in ascending order"
      - "[Team] firestore.indexes.json holds the CHAT_MESSAGES index (owner.id, created_at) and firebase.json deploys it"
      - "[Team] POST /public/auth no longer logs the init data or the user profile (BUG-002)"
      - "[Team] In the test emulator the AI is a mock (MockChatbotService)"

  - id: "TWA-01-FE"
    epic: "TWA-01"
    title: "Telegram sign-in in the Mini App and the real customer in the chat"
    surface: "frontend"
    tracker_ids: []
    status: "code_review"
    progress_percent: 90
    depends_on: ["TWA-01-BE"]
    acceptance_criteria:
      - "[Team] The Mini App loads the Telegram WebApp script, calls ready() and expand(), and signs in with its init data through POST /public/auth"
      - "[Team] The chat uses the signed-in customer's id and sends the customer token with every API call; no customer id is hard-coded"
      - "[Team] Opened outside Telegram or when sign-in fails, the app shows a message instead of the chat"
      - "[Team] A production build calls the API on its own origin (no emulator URL baked in)"
      - "[Team] Under next dev the app signs in outside Telegram with init data signed by the test bot token (?tgUser=<id> picks the customer); production builds contain neither the token nor the signing code"

  - id: "CAR-01-BE"
    epic: "CAR-01"
    title: "Save-car question from the AI and the customer actions endpoint"
    surface: "backend"
    tracker_ids: []
    status: "code_review"
    progress_percent: 90
    depends_on: ["TWA-01-BE"]
    acceptance_criteria:
      - "[Team] The AI answer carries car_in_message (the user's message names a valid car) and the car it understood"
      - "[Team] Car messages of an unfinished identification are kept in a 24-hour draft on the customer and sent to the AI; the draft grows while the AI needs more info and is cleared when it does not"
      - "[Team] The question {text: 'Хотите сохранить автомобиль в системе?', type: 'save_car', params: [car]} is added only when status is not need_more_info, car_in_message is true and the customer has no saved car; car is combined from all draft messages"
      - "[Team] POST /private/customers/{customerId}/actions with type save_car saves params[0] as the customer's car and marks the question of message_id answered; unknown type or invalid params → 400"
      - "[Team] With a saved car the AI gets it as saved_car and does not ask for the car again; the first greeting names the saved car"

  - id: "CAR-01-FE"
    epic: "CAR-01"
    title: "QuestionActionWidget in the chat"
    surface: "frontend"
    tracker_ids: []
    status: "code_review"
    progress_percent: 90
    depends_on: ["CAR-01-BE"]
    acceptance_criteria:
      - "[Team] An assistant message with a question shows QuestionActionWidget: the question text and an action button, or the done state once answered"
      - "[Team] The button sends POST /actions with type, params and message_id; while sending it is disabled, on success the widget shows that the car is saved, on error it shows a retry message"

  - id: "CAR-02-BE"
    epic: "CAR-02"
    title: "AI car suggestions and the questions array"
    surface: "backend"
    tracker_ids: []
    status: "code_review"
    progress_percent: 90
    depends_on: ["CAR-01-BE"]
    acceptance_criteria:
      - "[Team] ChatMessage carries questions: QuestionAction[] instead of question"
      - "[Team] With status need_more_info the AI returns up to 3 most probable complete cars (suggested_cars) consistent with what the customer said"
      - "[Team] When there are suggestions and the customer has no saved car, a second assistant message 'Возможно вам подходит какая-то из этих моделей?' follows the AI answer, with one save_car question per suggestion"
      - "[Team] Choosing a suggestion saves that car, clears the car draft and marks only that question answered"

  - id: "CAR-02-FE"
    epic: "CAR-02"
    title: "Carousel of car suggestions"
    surface: "frontend"
    tracker_ids: []
    status: "code_review"
    progress_percent: 90
    depends_on: ["CAR-02-BE"]
    acceptance_criteria:
      - "[Team] A message with several questions shows its text and then a carousel with one card per question (car and a save button); one question shows the single widget"
      - "[Team] After a choice the chosen card shows the saved state and the other cards are disabled, also after a reload"
