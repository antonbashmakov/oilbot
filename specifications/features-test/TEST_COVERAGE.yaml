# Test coverage per task. Statuses: planned, in_progress, done, n/a. Coverage is tracked separately from progress.
# Surfaces and test kinds are free-form; name them after the project's test kinds (features-test/README.md).
coverage:
  - feature: "SETUP-01-DOC"
    tooling: { checks: "planned" }
  - feature: "TWA-01-BE"
    backend: { types: "done", lint: "done", integration: "done", build: "done" }
  - feature: "TWA-01-FE"
    frontend: { types: "done", lint: "done", build: "done", browser: "done" }
  - feature: "CAR-01-BE"
    backend: { types: "done", lint: "done", integration: "done", build: "done" }
  - feature: "CAR-01-FE"
    frontend: { types: "done", lint: "done", build: "done", browser: "done" }
