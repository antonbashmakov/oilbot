<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Product Feed - Food Delivery</title>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet"/>
  <!-- Material Symbols -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <!-- Theme Config -->
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#ec1337",
            "background-light": "#f8f6f6",
            "background-dark": "#181112",
            "surface-light": "#ffffff",
            "surface-dark": "#221013",
            "text-main-light": "#181112",
            "text-main-dark": "#ffffff",
            "text-sub-light": "#896168",
            "text-sub-dark": "#dcb8be",
          },
          fontFamily: {
            "display": ["Plus Jakarta Sans", "sans-serif"]
          },
          borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
        },
      },
    }
  </script>
  <style>
    /* Hide scrollbar for Chrome, Safari and Opera */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    /* Hide scrollbar for IE, Edge and Firefox */
    .no-scrollbar {
      -ms-overflow-style: none;  /* IE and Edge */
      scrollbar-width: none;  /* Firefox */
    }
    
    .material-symbols-outlined {
      font-variation-settings:
      'FILL' 0,
      'wght' 400,
      'GRAD' 0,
      'opsz' 24
    }
    
    .material-symbols-outlined.filled {
      font-variation-settings:
      'FILL' 1,
      'wght' 400,
      'GRAD' 0,
      'opsz' 24
    }
  </style>
  <style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-text-main-light dark:text-text-main-dark selection:bg-primary/20">
  <div class="relative flex h-full min-h-screen w-full flex-col overflow-x-hidden pb-24">
    <!-- Sticky Header Group -->
    <div class="sticky top-0 z-30 bg-surface-light/95 dark:bg-surface-dark/95 backdrop-blur-md border-b border-gray-100 dark:border-white/5">
      <!-- Top App Bar -->
      <div class="flex items-center justify-between px-4 py-3">
        <div class="flex items-center gap-2 overflow-hidden">
          <span class="material-symbols-outlined text-primary">location_on</span>
          <div class="flex flex-col">
            <span class="text-xs font-medium text-text-sub-light dark:text-text-sub-dark uppercase tracking-wide">Delivering to</span>
            <h2 class="text-base font-bold leading-tight truncate">Downtown, Market St.</h2>
          </div>
        </div>
        <button class="relative flex size-10 items-center justify-center rounded-full bg-background-light dark:bg-white/10 hover:bg-gray-100 dark:hover:bg-white/20 transition-colors">
          <span class="material-symbols-outlined text-text-main-light dark:text-text-main-dark">shopping_cart</span>
          <span class="absolute top-1.5 right-1.5 h-2.5 w-2.5 rounded-full bg-primary ring-2 ring-white dark:ring-surface-dark"></span>
        </button>
      </div>
      <!-- Categories Chips -->
      <div class="flex gap-3 overflow-x-auto px-4 pb-4 pt-1 no-scrollbar">
        <!-- Active Chip -->
        <button class="group flex h-10 shrink-0 items-center justify-center gap-x-2 rounded-full bg-primary px-5 shadow-sm shadow-primary/30 transition-all active:scale-95">
          <span class="material-symbols-outlined text-white text-[20px]">restaurant</span>
          <p class="text-white text-sm font-bold">All</p>
        </button>
        <!-- Inactive Chips -->
        <button class="group flex h-10 shrink-0 items-center justify-center gap-x-2 rounded-full bg-white dark:bg-white/10 px-5 border border-gray-100 dark:border-white/5 transition-all hover:bg-gray-50 dark:hover:bg-white/20 active:scale-95">
          <span class="material-symbols-outlined text-text-main-light dark:text-text-main-dark text-[20px]">cooking</span>
          <p class="text-text-main-light dark:text-text-main-dark text-sm font-medium">Steaks</p>
        </button>
        <button class="group flex h-10 shrink-0 items-center justify-center gap-x-2 rounded-full bg-white dark:bg-white/10 px-5 border border-gray-100 dark:border-white/5 transition-all hover:bg-gray-50 dark:hover:bg-white/20 active:scale-95">
          <span class="material-symbols-outlined text-text-main-light dark:text-text-main-dark text-[20px]">set_meal</span>
          <p class="text-text-main-light dark:text-text-main-dark text-sm font-medium">Seafood</p>
        </button>
        <button class="group flex h-10 shrink-0 items-center justify-center gap-x-2 rounded-full bg-white dark:bg-white/10 px-5 border border-gray-100 dark:border-white/5 transition-all hover:bg-gray-50 dark:hover:bg-white/20 active:scale-95">
          <span class="material-symbols-outlined text-text-main-light dark:text-text-main-dark text-[20px]">local_pizza</span>
          <p class="text-text-main-light dark:text-text-main-dark text-sm font-medium">Cheese</p>
        </button>
        <button class="group flex h-10 shrink-0 items-center justify-center gap-x-2 rounded-full bg-white dark:bg-white/10 px-5 border border-gray-100 dark:border-white/5 transition-all hover:bg-gray-50 dark:hover:bg-white/20 active:scale-95">
          <span class="material-symbols-outlined text-text-main-light dark:text-text-main-dark text-[20px]">egg</span>
          <p class="text-text-main-light dark:text-text-main-dark text-sm font-medium">Caviar</p>
        </button>
      </div>
    </div>

        </div>

          <h3 class="text-text-main-light dark:text-text-main-dark text-base font-bold leading-tight">USDA Prime Ribeye</h3>
          <div class="flex items-baseline gap-1">
            <span class="text-primary text-lg font-bold">$24.99</span>
            <span class="text-text-sub-light dark:text-text-sub-dark text-xs font-medium">/ lb</span>
          </div>
          <div class="flex items-center gap-1.5 mt-1">
            <span class="material-symbols-outlined text-[14px] text-green-600 dark:text-green-400">local_shipping</span>
            <p class="text-text-sub-light dark:text-text-sub-dark text-xs font-medium">Tomorrow, 10 AM</p>
          </div>
        </div>
      </div>

            <span class="material-symbols-outlined">add</span>

        </div>
        <div class="flex flex-col gap-1">
          <h3 class="text-text-main-light dark:text-text-main-dark text-base font-bold leading-tight">Atlantic Salmon</h3>
          <div class="flex items-baseline gap-1">
            <span class="text-primary text-lg font-bold">$18.50</span>
            <span class="text-text-sub-light dark:text-text-sub-dark text-xs font-medium">/ lb</span>
          </div>
          <div class="flex items-center gap-1.5 mt-1">
            <span class="material-symbols-outlined text-[14px] text-green-600 dark:text-green-400">bolt</span>
            <p class="text-text-sub-light dark:text-text-sub-dark text-xs font-medium">Today, 6 PM</p>
          </div>
        </div>
      </div>
      <!-- Product Card 3 -->
      <div class="flex flex-col group/card">
        <div class="relative mb-3 overflow-hidden rounded-xl bg-gray-100 dark:bg-white/5">

          </div>
          <button class="absolute bottom-2 right-2 flex size-10 items-center justify-center rounded-full bg-white dark:bg-surface-dark text-primary shadow-lg transition-transform active:scale-90 hover:bg-primary hover:text-white">
            <span class="material-symbols-outlined">add</span>
          </button>
        </div>
        <div class="flex flex-col gap-1">
          <h3 class="text-text-main-light dark:text-text-main-dark text-base font-bold leading-tight">Aged Cheddar</h3>
          <div class="flex items-baseline gap-1">
            <span class="text-primary text-lg font-bold">$12.00</span>
            <span class="text-text-sub-light dark:text-text-sub-dark text-xs font-medium">/ block</span>
          </div>
          <div class="flex items-center gap-1.5 mt-1">
            <span class="material-symbols-outlined text-[14px] text-green-600 dark:text-green-400">local_shipping</span>
            <p class="text-text-sub-light dark:text-text-sub-dark text-xs font-medium">Tomorrow, 10 AM</p>

        </div>
      </div>

            <span class="material-symbols-outlined">add</span>
          </button>
        </div>
        <div class="flex flex-col gap-1">
          <h3 class="text-text-main-light dark:text-text-main-dark text-base font-bold leading-tight">Beluga Caviar</h3>
          <div class="flex items-baseline gap-1">
            <span class="text-primary text-lg font-bold">$120.00</span>
            <span class="text-text-sub-light dark:text-text-sub-dark text-xs font-medium">/ oz</span>
          </div>
          <div class="flex items-center gap-1.5 mt-1">
